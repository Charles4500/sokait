# Render Blueprint: Sokait (web app, agent and voice services) on one free web service.
# All three services fit the free instance's 512 MB (about 350 MB in use).
services:
  - type: web
    name: sokait
    runtime: docker
    plan: free
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
