# Git hooks for both services. Install once with: cd web && bun install
# (the lefthook package registers the hooks for the whole repository).

pre-commit:
  parallel: true
  commands:
    web-format:
      root: "web/"
      glob: "*.{ts,tsx,js,json,css,md,yml}"
      run: node_modules/.bin/prettier --check {staged_files}
    web-lint:
      root: "web/"
      glob: "*.{ts,tsx}"
      run: node_modules/.bin/eslint {staged_files}
    agents-lint:
      root: "agents/"
      glob: "*.py"
      run: uv run ruff check {staged_files} && uv run ruff format --check {staged_files}

commit-msg:
  commands:
    conventional:
      run: |
        msg=$(head -n1 "{1}")
        pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .{1,72}$'
        if ! printf '%s' "$msg" | grep -Eq "$pattern"; then
          echo "Commit message must follow Conventional Commits, e.g. 'feat(web): add tactical pitch'."
          echo "Got: $msg"
          exit 1
        fi

pre-push:
  parallel: true
  commands:
    web-check:
      root: "web/"
      run: bun run typecheck && bun run test
    agents-test:
      root: "agents/"
      run: uv run pytest -q
