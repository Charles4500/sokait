[project]
name = "pitchpulse-agents"
version = "0.1.0"
description = "PitchPulse multi-agent match insights service (Microsoft Agent Framework)"
authors = [
    { name = "CharlesKibet", email = "charlesbiegon973@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "agent-framework-core>=1.22",
    "agent-framework-foundry>=1.15",
    "agent-framework-openai>=1.17",
    "azure-identity>=1.26",
    "fastapi>=0.115",
    "piper-tts>=1.8.0",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
