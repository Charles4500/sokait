[project]
name = "pitchpulse-voice"
version = "0.1.0"
description = "Spoken commentary for PitchPulse with Piper neural voices"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.156.5",
    "piper-tts>=1.8.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
